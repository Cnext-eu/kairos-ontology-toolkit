[project]
name = "kairos-ontology-toolkit"
dynamic = ["version"]
description = "Validation and projection tools for OWL/Turtle ontologies in the Kairos platform"
authors = [{name = "Cnext", email = "info@cnext.eu"}]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["ontology", "owl", "turtle", "rdf", "shacl", "validation", "projection"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "rdflib>=7.4.0",
    "pySHACL>=0.30.1",
    "owlrl>=7.1.4",
    "Jinja2>=3.1.3",
    "click>=8.1.7",
    "PyYAML>=6.0",
    "openai>=1.0.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "packaging>=23.0",
    # Document parsing for business discovery (DD-060) and Parquet source import:
    #   pypdf   — extract text from PDF artifacts in .import/businessdiscovery/
    #   pyarrow — read Parquet source/data files (also exposed via the [parquet] extra)
    "pypdf>=6.14.2",
    "pyarrow>=14.0.0",
    # JSON-Schema validation of archetype catalog files (issue #203 / DD-090).
    "jsonschema>=4.0.0",
]

[project.optional-dependencies]
# User-facing extras — installable via `pip install kairos-ontology-toolkit[<extra>]`.
# These MUST mirror the matching [dependency-groups] entries below (same pins): the
# groups serve `uv sync --group <extra>` workflows, while these optional-dependencies
# are what actually ship in the wheel metadata so the documented pip install works.
azure = [
    "azure-identity>=1.15.0,<2.0.0",
]
foundry = [
    "azure-ai-projects>=2.0.0,<3.0.0",
    "azure-identity>=1.15.0,<2.0.0",
]
flatfile = [
    "openpyxl>=3.1.0,<4.0.0",
]
parquet = [
    "pyarrow>=14.0.0",
]
# OpenTelemetry-ready structured logging bridge (DD-151). Opt-in and off by default:
# the package import must never fail when the extra is absent. Activated by OTEL_*
# environment variables; export failure never affects CLI exit codes.
otel = [
    "opentelemetry-api>=1.28.0,<2.0.0",
    "opentelemetry-sdk>=1.28.0,<2.0.0",
    "opentelemetry-exporter-otlp>=1.28.0,<2.0.0",
]
# Langfuse LLM tracing (DD-184). Opt-in and off by default: activated only when
# LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY and LANGFUSE_HOST are all set. A missing
# package degrades to untraced operation and never fails a run.
langfuse = [
    "langfuse>=4.14.0,<5.0.0",
]

[project.urls]
Homepage = "https://github.com/Cnext-eu/kairos-ontology-toolkit"
Repository = "https://github.com/Cnext-eu/kairos-ontology-toolkit"
Changelog = "https://github.com/Cnext-eu/kairos-ontology-toolkit/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Cnext-eu/kairos-ontology-toolkit/tree/main/docs"
Issues = "https://github.com/Cnext-eu/kairos-ontology-toolkit/issues"

[project.scripts]
kairos-ontology = "kairos_ontology.cli.main:cli"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.5.0",
    "pytest-ruff>=0.4.0",
    "pytest-asyncio>=1.0,<2.0",
    # Parallel test execution. The suite is ~3.8k small tests whose cost is
    # dominated by per-test overhead rather than any single slow case, so
    # sharding across cores is by far the largest available speedup.
    "pytest-xdist>=3.5.0",
    # Reference models for cross-repo contract tests (DD-158). Resolved from the
    # installed package via [tool.uv.sources] below.
    "kairos-ontology-referencemodels",
]
azure = [
    "azure-identity>=1.15.0,<2.0.0",
]
foundry = [
    "azure-ai-projects>=2.0.0,<3.0.0",
    "azure-identity>=1.15.0,<2.0.0",
]
flatfile = [
    "openpyxl>=3.1.0,<4.0.0",
]
parquet = [
    "pyarrow>=14.0.0",
]
otel = [
    "opentelemetry-api>=1.28.0,<2.0.0",
    "opentelemetry-sdk>=1.28.0,<2.0.0",
    "opentelemetry-exporter-otlp>=1.28.0,<2.0.0",
]
langfuse = [
    "langfuse>=4.14.0,<5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/kairos_ontology/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kairos_ontology"]

[tool.hatch.build]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/*.pyo",
]

[tool.hatch.build.targets.sdist]
include = [
    "CHANGELOG.md",
    "LICENSE",
    "NOTICE",
    "README.md",
    "pyproject.toml",
    "src/kairos_ontology/**/*",
]

# Reference models resolved from the published GitHub Release wheel (DD-158).
# Update with `kairos-ontology update-refmodels` after a new release is cut.
[tool.uv.sources]
kairos-ontology-referencemodels = { url = "https://github.com/Cnext-eu/kairos-ontology-referencemodels/releases/download/v1.35.2/kairos_ontology_referencemodels-1.35.2-py3-none-any.whl" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E4", "E7"]
per-file-ignores = {"tests/*" = ["E741", "E402", "F841"]}

[tool.pytest.ini_options]
# "strict", not "auto": the suite currently contains zero `async def` tests and
# zero async fixtures, so "auto" only paid pytest-asyncio's per-item collection
# wrapper on ~3.8k synchronous tests for no benefit. Under "strict" an *unmarked*
# async test does not silently skip — pytest fails it outright with "async
# functions are not natively supported" — so this cannot hide a future async test.
# Re-verified against pytest 9 + pytest-asyncio 1.x when the pin moved: an unmarked
# async test still fails rather than passing or skipping.
# To add one, decorate it with `@pytest.mark.asyncio`.
asyncio_mode = "strict"
testpaths = ["tests"]
# `-n auto` shards the suite across cores via pytest-xdist. Verified
# order-independent: see the observability-isolation fixture in tests/conftest.py.
# Use `-p no:xdist` or `-n0` for a single-process run when debugging.
addopts = "-m 'not slow' -n auto"
markers = [
    "slow: marks tests as slow QA checks (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    # Ignore deprecation warnings from rdflib's SPARQL parser using old pyparsing API
    # This is a known issue in rdflib 7.5.0 with pyparsing 3.3.1
    # See: https://github.com/RDFLib/rdflib/issues/2563
    "ignore::DeprecationWarning:rdflib.plugins.sparql.parser",
    "ignore::DeprecationWarning:rdflib.plugins.sparql.parserutils",
    "ignore::DeprecationWarning:pyparsing.util",
]