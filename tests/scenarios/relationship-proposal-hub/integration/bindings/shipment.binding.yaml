# Uniform surrogate identity, shared with `shipment-leg`: the shape #722 reports, where
# every relation names its own key `source_record_id`.
apiVersion: kairos.eu/v5
kind: EntityBinding
metadata:
  name: shipment
  domain: sales
source:
  relation: erp.shipments
target:
  class: "https://synthetic.test/ont/sales#Shipment"
grain:
  columns: [source_record_id]
identity:
  strategy: source-natural
  sourceKey: [source_record_id]
load:
  mode: full-refresh
fields: []
relationships: []
technicalFields:
  - {name: source_record_id, expression: source_record_id, type: string, nullable: false, purpose: identity}
