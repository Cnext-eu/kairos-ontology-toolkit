name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write   # create GitHub Release (with built wheel/sdist assets) and push the tag

jobs:
  # Unifies two release triggers into one tag + should_release decision:
  #   - a tag push (docs/RELEASING.md hotfix runbook: tag a hotfix/x.y.z branch
  #     directly, never touching main) -- behaves exactly as before.
  #   - a push to main (the normal case: a squash-merged version-bump PR) -- detects
  #     whether __version__ actually changed and, if so, creates and pushes the tag
  #     itself, so release-cutting never again depends on a manual `git tag` step.
  #
  # Both paths are handled in this one workflow, rather than a separate "tag on
  # bump" workflow feeding this one via its tag-push trigger, because a tag pushed
  # by a workflow's own GITHUB_TOKEN does not trigger another workflow's `push:
  # tags` listener (GitHub's anti-recursion rule) -- chaining that way would either
  # silently never build, or require a PAT secret to work around it.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      should_release: ${{ steps.resolve.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release tag
        id: resolve
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Push to main: only a real __version__ bump warrants a release. Same
          # comparison version-check.yml already makes for a PR against main.
          CURR_VERSION=$(grep '^__version__' src/kairos_ontology/__init__.py \
            | sed 's/.*"\(.*\)".*/\1/')
          PREV_VERSION=$(git show HEAD~1:src/kairos_ontology/__init__.py 2>/dev/null \
            | grep '^__version__' | sed 's/.*"\(.*\)".*/\1/' || echo "")
          if [ "$CURR_VERSION" = "$PREV_VERSION" ]; then
            echo "No __version__ change ($CURR_VERSION) -- nothing to release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG="v${CURR_VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::notice::Tag $TAG already exists -- already released, skipping."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Version bumped $PREV_VERSION -> $CURR_VERSION, tagging $TAG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    if: needs.resolve.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Verify version matches tag
        run: |
          RAW_TAG="${{ needs.resolve.outputs.tag }}"
          RAW_TAG="${RAW_TAG#v}"
          # Normalize the SemVer-style tag to PEP 440, mirroring
          # _tag_to_version() in src/kairos_ontology/cli/shared.py so that both
          # v4.4.0rc1 and v4.4.0-rc.1 validate against __version__.
          TAG=$(echo "$RAW_TAG" \
            | sed -E 's/-rc\.?([0-9]+)/rc\1/' \
            | sed -E 's/-beta\.?([0-9]+)/b\1/' \
            | sed -E 's/-alpha\.?([0-9]+)/a\1/')
          PKG_VERSION=$(grep '^__version__' src/kairos_ontology/__init__.py \
            | sed 's/.*"\(.*\)".*/\1/')
          echo "Tag (raw):         $RAW_TAG"
          echo "Tag (normalized):  $TAG"
          echo "Package version:   $PKG_VERSION"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch! Tag v$RAW_TAG (→ $TAG) but __version__ is $PKG_VERSION."
            echo "::error::Bump __version__ in src/kairos_ontology/__init__.py to match the tag."
            exit 1
          fi
          echo "✅ Version matches tag"

      - name: Verify CHANGELOG has an entry for the release
        run: |
          TAG="${{ needs.resolve.outputs.tag }}"
          VERSION="${TAG#v}"
          # Pre-releases (rc/beta/alpha) are throwaway test builds — exempt.
          if [[ "$TAG" =~ (rc|beta|alpha) ]]; then
            echo "Pre-release $TAG — skipping CHANGELOG entry check."
            exit 0
          fi
          if ! grep -qE "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section."
            echo "::error::Promote the [Unreleased] section to a dated '## [${VERSION}]'"
            echo "::error::heading and commit it before tagging the release."
            exit 1
          fi
          echo "✅ CHANGELOG entry found for ${VERSION}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"

      - name: Build package
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: [resolve, build]
    if: needs.resolve.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Detect pre-release
        id: prerelease
        run: |
          TAG="${{ needs.resolve.outputs.tag }}"
          if [[ "$TAG" =~ (rc|beta|alpha) ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "flags=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "flags=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.resolve.outputs.tag }}"
          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists — uploading assets only"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --generate-notes \
              ${{ steps.prerelease.outputs.flags }}
          fi
