name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint (ruff)
        run: uv run ruff check src/ tests/

      - name: Test
        run: uv run pytest tests/ -v --tb=short

  # refmodels-pin used to run here, per-PR. Moved to its own scheduled workflow
  # (refmodels-pin.yml): it checks another repo's release feed, not this PR's
  # diff, so gating every open PR's CI on it meant an unrelated upstream release
  # broke every open PR simultaneously (#571's batch, 2026-08-20) — busywork
  # with no relationship to what any of those PRs actually changed. A daily
  # schedule now opens (or updates) a bump PR when the pin drifts, instead.
