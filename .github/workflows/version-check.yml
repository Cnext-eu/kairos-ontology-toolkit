name: Version check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history for diff

      - name: Require CHANGELOG entry for a bumped version
        run: |
          # Version bumps happen at release time (docs/RELEASING.md), not on every
          # PR. This only enforces that *if* a PR does bump __version__ to a stable
          # release, it also carries the matching CHANGELOG entry.
          PR_VERSION=$(grep '__version__' src/kairos_ontology/__init__.py \
            | sed 's/.*"\(.*\)".*/\1/')
          MAIN_VERSION=$(git show origin/main:src/kairos_ontology/__init__.py \
            | grep '__version__' | sed 's/.*"\(.*\)".*/\1/')

          if [ "$MAIN_VERSION" = "$PR_VERSION" ]; then
            exit 0
          fi

          # Pre-release versions (PEP 440 rc/b/a suffix) don't need an entry.
          if [[ "$PR_VERSION" =~ (rc|b|a)[0-9] ]]; then
            echo "Pre-release version $PR_VERSION — CHANGELOG entry optional."
            exit 0
          fi

          if ! grep -qE "^## \[${PR_VERSION}\]" CHANGELOG.md; then
            echo "::error::Version bumped to ${PR_VERSION} but CHANGELOG.md has no"
            echo "::error::'## [${PR_VERSION}]' entry. Promote the [Unreleased] section to a"
            echo "::error::dated '## [${PR_VERSION}]' heading."
            exit 1
          fi

          echo "✅ CHANGELOG entry present for ${PR_VERSION}"
