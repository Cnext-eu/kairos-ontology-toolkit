#
# Auto-close issues referenced in merged PRs that did not use closing keywords.
#
# Only **parenthetical** references close an issue — e.g. "(#123)", matching this
# repo's squash-title convention ("fix: … (#286, #338) (#402)"). A bare "#123" in
# prose is a cross-reference, not a claim that the work is done.
#
# That distinction is load-bearing. This workflow previously closed every "#NNN"
# it found anywhere in the title or body, so a PR saying "deferred to #422" or
# "split out as #423" was indistinguishable from one saying it fixed them — and
# when PR #425 merged it closed two deliberately-deferred follow-ups as
# "completed". A reference is not a fix.
#
# A parenthetical reference can also be *scoped*: "(#562 P2)" or "(#562 Problem 2)"
# means the PR fixes only part of a multi-part issue, so the issue must stay open.
# This workflow previously ignored such qualifiers — when PR #577 merged with
# "(DD-203, #562 P2)" it closed #562 even though Problems 3 and 4 were untouched.
# A qualifier directly after the number (P2, P3+P4, "Problem 2") skips the close.
name: Auto-close referenced issues

on:
  pull_request_target:
    types: [closed]

permissions:
  issues: write
  pull-requests: write

jobs:
  auto-close:
    # Only run when the PR was merged (not just closed without merge).
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Auto-close issues referenced in merged PR
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const title = pr.title || "";
            const body = pr.body || "";
            const combined = `${title}\n${body}`;

            // Closing keywords: GitHub has already closed these itself, so skip them.
            const closingKeyword = /\b(closes|fixes|resolves)\b\s+(?:issue\s+)?(?:in\s+)?#(\d+)/i;
            const closingMatches = combined.match(new RegExp(closingKeyword.source, 'gi')) || [];
            const closedNumbers = new Set();
            for (const m of closingMatches) {
              const num = m.match(/#(\d+)/);
              if (num) closedNumbers.add(num[1]);
            }

            // Words that mark a reference as explicitly NOT a fix. If any appears shortly
            // before the parenthetical, the reference is a pointer, not a claim of work done.
            const NON_FIXING = /\b(refs?|references?|related|see|see also|deferred?|defers?|split out|splits? out|supersed(es|ed)|blocked by|blocks|part of|follows?|follow[- ]?ups?|tracked in|tracking|per|cf|context|discussion|depends on|prerequisite)\b[^.!?]{0,80}$/i;

            // A qualifier directly after the number scopes the reference to part of the
            // issue — a partial fix must not close the whole issue. This covers the
            // spellings used in squash titles: "P2", "P3+P4", and "Problem 2"
            // (PR #577's "(DD-203, #562 P2)" closed #562 before this check existed).
            const PARTIAL_QUALIFIER = /^\s*(?:P\d+(?:\s*[+,]\s*P?\d+)*|Problems?\s+\d+)/i;

            // Only parenthetical groups containing an issue number, per the contract above.
            const groupPattern = /\(([^()]*#\d+[^()]*)\)/g;
            const toClose = new Set();
            const skipped = [];
            let group;
            while ((group = groupPattern.exec(combined)) !== null) {
              const preceding = combined.slice(Math.max(0, group.index - 90), group.index);
              const isNonFixing = NON_FIXING.test(preceding);
              const numPattern = /#(\d+)/g;
              let m;
              while ((m = numPattern.exec(group[1])) !== null) {
                const num = m[1];
                if (num === String(prNumber)) continue;      // the PR's own squash-title suffix
                if (closedNumbers.has(num)) continue;        // GitHub already closed it
                if (isNonFixing) { skipped.push(`#${num}`); continue; }
                const trailing = group[1].slice(m.index + m[0].length);
                if (PARTIAL_QUALIFIER.test(trailing)) {
                  skipped.push(`#${num} (partial-fix qualifier)`);
                  continue;
                }
                toClose.add(num);
              }
            }

            if (skipped.length > 0) {
              core.info(`Skipped non-fixing references: ${skipped.join(', ')}`);
            }

            if (toClose.size === 0) {
              core.info("No parenthetical issue references to close.");
              return;
            }

            core.info(`PR title: ${title}`);
            core.info(`Parenthetical issue references to check: ${[...toClose].join(', ')}`);

            const repo = context.repo;
            let closedAny = false;

            for (const issueNum of toClose) {
              try {
                // Check if the issue exists and is open.
                const { data: issue } = await github.rest.issues.get({
                  ...repo,
                  issue_number: parseInt(issueNum, 10),
                });

                if (issue.state !== 'open') {
                  core.info(`Issue #${issueNum} is already ${issue.state}, skipping.`);
                  continue;
                }

                if (issue.pull_request) {
                  core.info(`#${issueNum} is a PR, not an issue, skipping.`);
                  continue;
                }

                // Close the issue with a note.
                await github.rest.issues.createComment({
                  ...repo,
                  issue_number: parseInt(issueNum, 10),
                  body: `Auto-closed by GitHub Action: PR #${prNumber} was merged with a parenthetical reference to this issue but did not use closing keywords.\n` +
                        `\n> **Tip:** To auto-close issues on merge, use \`Closes #${issueNum}\`, \`Fixes #${issueNum}\`, or \`Resolves #${issueNum}\` in the PR body.` +
                        `\n>\n> If a PR only *mentions* an issue it does not fix, write it as a bare \`#${issueNum}\` (no parentheses) or prefix it with \`Refs\`/\`Related\`/\`Deferred to\` — this workflow will then leave it open.` +
                        `\n>\n> If a PR fixes only *part* of a multi-part issue, add a qualifier right after the number — \`(#${issueNum} P2)\` or \`(#${issueNum} Problem 2)\` — and this workflow will leave the issue open.`,
                });

                await github.rest.issues.update({
                  ...repo,
                  issue_number: parseInt(issueNum, 10),
                  state: 'closed',
                  state_reason: 'completed',
                });

                core.info(`Closed issue #${issueNum}.`);
                closedAny = true;
              } catch (err) {
                core.warning(`Could not process issue #${issueNum}: ${err.message}`);
              }
            }

            if (!closedAny) {
              core.info("No issues were auto-closed.");
            }
