name: Dependency audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly audit (Mondays 06:42 UTC) so newly disclosed CVEs are caught even
    # without a code change.
    - cron: "42 6 * * 1"

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (uv.lock)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Export locked dependencies
        # Audit the fully resolved lockfile (all groups + optional extras) rather
        # than the loose floors in pyproject.toml, so the exact pinned versions
        # are checked.
        # kairos-ontology-referencemodels is a GitHub-Release wheel, not on PyPI,
        # so pip-audit cannot look it up. Exclude it from the audit requirements.
        run: >
          uv export --no-emit-project --all-groups --all-extras
          --format requirements-txt
          | grep -v 'kairos-ontology-referencemodels'
          > requirements-audit.txt

      - name: Run pip-audit
        # PYSEC-2026-1845 is a dev/test-only pytest advisory whose fix (9.0.3)
        # requires a major-version bump that conflicts with the `<9` pin; it is
        # not shipped to users. Tracked for removal when the pin is widened.
        run: >
          uvx pip-audit --requirement requirements-audit.txt --strict
          --ignore-vuln PYSEC-2026-1845
