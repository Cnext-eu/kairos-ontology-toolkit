# Auto-generated by kairos-ontology-toolkit — do not edit.
# Pull-request workflow (DD-206 §4 "Hub pull request"): validates ontology, SHACL,
# binding, and dbt-package correctness, then regenerates the tracked publish output
# and fails on drift. This runs *alongside* managed-check.yml (which only verifies
# toolkit-managed files), not instead of it.

name: PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # An unpinned version queries github.com's "latest release" API, which
          # 404s from a GitHub Enterprise Server host (astral-sh/uv doesn't exist
          # there). Pinning a known-good version skips that lookup entirely.
          version: "0.12.5"

      - name: Install toolkit
        run: uv sync --locked

      - name: Validate ontologies (syntax, SHACL, consistency)
        run: |
          uv run kairos-ontology validate \
            --ontologies ontology-hub/model/ontologies \
            --shapes ontology-hub/model/shapes \
            --all

      # Parses every closed integration/bindings/*.binding.yaml against the
      # packaged EntityBinding schema and the canonical compiler (DD-206 §4.2:
      # "runs compile checks"). --all discovers every domain named by at least
      # one binding in this hub -- the same discovery `compile --all --emit`
      # uses below, so a domain skipped here would also be skipped at emit time.
      - name: Compile-check every bound domain
        run: |
          uv run kairos-ontology compile --all --check --format json

      # DD-206 §4.2: "regenerates the tracked publish output" / "fails if the
      # committed output differs from regenerated output". Only
      # ontology-hub-publish/medallion/dbt and ontology-hub-publish/powerbi are
      # Git-tracked (see gitignore.template) -- every other projection target
      # stays ignored, so the diff below is scoped to exactly those two paths.
      - name: Regenerate tracked publish output and fail on drift
        run: |
          uv run kairos-ontology compile --all --emit --confirm-emit
          git diff --exit-code -- \
            ontology-hub-publish/medallion/dbt \
            ontology-hub-publish/powerbi

      # DD-206 §4.2: "validates the assembled dbt package". Structural-only
      # needs no dbt install and no adapter -- it just scans the regenerated
      # project on disk for dangling cross-domain ref()s (#342).
      - name: Validate assembled dbt package
        run: |
          uv run kairos-ontology validate-dbt --structural-only
