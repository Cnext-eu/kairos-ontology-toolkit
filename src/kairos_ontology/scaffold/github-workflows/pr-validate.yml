# Auto-generated by kairos-ontology-toolkit — do not edit.
# Pull-request workflow (DD-206 §4 "Hub pull request"): validates ontology, SHACL,
# binding, and dbt-package correctness, then regenerates the tracked publish output
# and fails on drift. This runs *alongside* managed-check.yml (which only verifies
# toolkit-managed files), not instead of it.

name: PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # An unpinned version queries github.com's "latest release" API, which
          # 404s from a GitHub Enterprise Server host (astral-sh/uv doesn't exist
          # there). Pinning a known-good version skips that lookup entirely.
          version: "0.12.5"

      - name: Install toolkit
        run: uv sync --locked

      - name: Validate ontologies (syntax, SHACL, consistency)
        run: |
          uv run kairos-ontology validate \
            --ontologies ontology-hub/model/ontologies \
            --shapes ontology-hub/model/shapes \
            --all

      # Parses every closed integration/bindings/*.binding.yaml against the
      # packaged EntityBinding schema and the canonical compiler (DD-206 §4.2:
      # "runs compile checks"). --all discovers every domain named by at least
      # one binding in this hub -- the same discovery `compile --all --emit`
      # uses below, so a domain skipped here would also be skipped at emit time.
      - name: Compile-check every bound domain
        run: |
          uv run kairos-ontology compile --all --check --format json

      # DD-215: lints the *hand-authored* dbt transform tree -- meta.kairos
      # completeness, grain_key, and adapter dialect rules. Offline: no dbt
      # install, no adapter, no warehouse. Runs before emit because a broken
      # authored contract would otherwise surface as a confusing compile error.
      # Skipped cleanly when the hub authors no dbt transforms at all.
      - name: Lint hand-authored dbt transforms
        env:
          KAIROS_SKILL_CONTEXT: "1"
        run: |
          uv run kairos-ontology validate-dbt-contracts --format json

      # DD-206 §4.2: "regenerates the tracked publish output" / "fails if the
      # committed output differs from regenerated output". Only
      # ontology-hub-publish/medallion/dbt and ontology-hub-publish/powerbi are
      # Git-tracked (see gitignore.template) -- every other projection target
      # stays ignored, so the diff below is scoped to exactly those two paths.
      #
      # The tracked-ness assertion is load-bearing (#699). `git diff --exit-code --
      # <path>` exits 0 when *nothing at that path is tracked*, so the natural
      # reaction to line-ending churn -- gitignoring the generated tree and running
      # `git rm -r --cached` -- turns this gate into a permanent green light with no
      # error, no warning, and nothing in the log. It fails open, undetectably.
      # Especially load-bearing because a dataplatform pins
      # `subdirectory: ontology-hub-publish/medallion/dbt` at a SHA: an untracked
      # package path also silently disables `verified_hub_sha` staleness checking.
      - name: Regenerate tracked publish output and fail on drift
        run: |
          set -euo pipefail
          uv run kairos-ontology compile --all --emit --confirm-emit
          for path in ontology-hub-publish/medallion/dbt ontology-hub-publish/powerbi; do
            if [ -d "$path" ] && [ -z "$(git ls-files "$path")" ]; then
              echo "::error::$path exists but is not tracked - the drift gate cannot verify it."
              exit 1
            fi
          done
          git diff --exit-code -- \
            ontology-hub-publish/medallion/dbt \
            ontology-hub-publish/powerbi

      # DD-206 §4.2: "validates the assembled dbt package".
      #
      # The full gate, not `--structural-only` (#686). Structural-only stops after the
      # ref() scan, so it cannot detect a project dbt refuses to parse -- a duplicate
      # model name passed every step of this workflow while `dbt parse` reported
      # "found two models with the name ...". `dbt parse` covers a far wider class than
      # anything re-implemented here, which is the actual argument for running it.
      #
      # Still offline and credential-free: only the final `dbt compile` needs a
      # warehouse, and it degrades to `environment-blocked` rather than failing.
      # `--platform` is resolved from `adapter:` in ontology-hub/kairos.yaml, so this
      # step needs no per-hub templating -- but `dbt deps`/`dbt parse` *hard-fail* when
      # the adapter is absent, so the extra must be installed first.
      #
      # The extra name is resolved by the toolkit, never composed here: DD-215 renamed
      # the canonical adapter id to `fabric-warehouse` while the hub extra stayed
      # `dbt-validate-fabric`, so `dbt-validate-$adapter` names an extra no hub declares.
      - name: Install dbt adapter for the full offline gate
        run: |
          set -euo pipefail
          extra="$(uv run python -c 'import re,pathlib;from kairos_ontology.core.adapters import dbt_validate_extra;t=pathlib.Path("ontology-hub/kairos.yaml").read_text(encoding="utf-8");m=re.search(r"^adapter:\s*([A-Za-z0-9._-]+)",t,re.M);print(dbt_validate_extra(m.group(1)) if m else "")')"
          if [ -z "$extra" ]; then
            echo "::error::ontology-hub/kairos.yaml declares no 'adapter:' - the dbt gate cannot run."
            exit 1
          fi
          uv sync --extra "$extra"

      # No --platform: validate-dbt resolves it from ontology-hub/kairos.yaml itself.
      - name: Validate assembled dbt package
        run: |
          uv run kairos-ontology validate-dbt
