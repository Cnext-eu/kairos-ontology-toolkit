name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # An unpinned version queries github.com's "latest release" API, which
          # 404s from a GitHub Enterprise Server host (astral-sh/uv doesn't exist
          # there). Pinning a known-good version skips that lookup entirely.
          version: "0.12.5"
          enable-cache: true

      - name: Install toolkit and dependencies
        run: uv sync --locked

      - name: Install Node.js (for Mermaid CLI SVG export)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install npm dependencies
        run: |
          if [ -f "package.json" ]; then
            # No lockfile is scaffolded or generated for this project, so a
            # lockfile-strict install here would always fail.
            npm install
          fi
