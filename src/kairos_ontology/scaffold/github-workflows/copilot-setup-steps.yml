# Auto-generated by kairos-ontology-toolkit — do not edit.
# Configures the development environment for the GitHub Copilot coding agent.
# This workflow runs before Copilot starts working on an issue, ensuring it
# has Python, the kairos-ontology-toolkit, and all dependencies available
# to validate ontologies and run projections.

name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # An unpinned version queries github.com's "latest release" API, which
          # 404s from a GitHub Enterprise Server host (astral-sh/uv doesn't exist
          # there). Pinning a known-good version skips that lookup entirely.
          version: "0.12.5"

      - name: Install toolkit and dependencies
        run: uv sync --locked

      - name: Install Node.js (for Mermaid CLI SVG export)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install npm dependencies
        run: |
          if [ -f "package.json" ]; then
            # No lockfile is scaffolded or generated for this project, so a
            # lockfile-strict install here would always fail.
            npm install
          fi
