# Auto-generated by kairos-ontology-toolkit — do not edit.
# Tag-triggered workflow: validates, and creates a GitHub Release with the
# already-tracked dbt artifacts for downstream consumption.
#
# DD-206 §4 ("release-relevant output... does not generate different bytes
# after tagging"): a release publishes exactly the bytes reviewed and merged
# in the hub PR at this tagged commit. It never regenerates
# ontology-hub-publish/medallion/dbt itself -- pr-validate.yml is what
# regenerates and diffs that output, before merge. This workflow only
# validates the tracked bytes checked out at the tag, read-only.

name: Release Projections

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  project-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # An unpinned version queries github.com's "latest release" API, which
          # 404s from a GitHub Enterprise Server host (astral-sh/uv doesn't exist
          # there). Pinning a known-good version skips that lookup entirely.
          version: "0.12.5"

      - name: Install toolkit
        run: uv sync --locked

      # DD-206 §4: the release workflow validates the tracked bytes at the tagged
      # commit; it never generates different bytes after tagging. pr-validate.yml
      # already regenerated ontology-hub-publish/medallion/dbt and failed on drift
      # before this commit could merge, so the tree checked out here is exactly
      # what a reviewer approved. This scan needs no dbt install (DD-138/139 keep
      # dbt itself, and any peer-binding search, out of per-domain compile scope)
      # and catches a dangling cross-domain externalReference (#342) that only
      # becomes visible once every domain's output is assembled together.
      - name: Validate assembled dbt package (read-only, no regeneration)
        run: |
          uv run kairos-ontology validate-dbt --structural-only

      # `project --target all` contains only retained graph projections. Gold and
      # MDM are compile-plan-only consumers and are intentionally not generated here.
      - name: Run retained optional projections
        run: |
          uv run kairos-ontology project \
            --ontologies ontology-hub/model/ontologies \
            --target all

      - name: Validate ontologies
        run: |
          uv run kairos-ontology validate \
            --ontologies ontology-hub/model/ontologies \
            --shapes ontology-hub/model/shapes

      - name: Package dbt artifacts
        run: |
          rm -f dbt-artifacts.zip
          if [ -d "ontology-hub-publish/medallion/dbt" ] && \
             find "ontology-hub-publish/medallion/dbt" -type l -print -quit | grep -q .; then
            echo "::error::Refusing to package symlinks from compiler output."
            exit 1
          fi
          if [ -d "ontology-hub-publish/medallion/dbt" ] && \
             find "ontology-hub-publish/medallion/dbt" -type f -print -quit | grep -q .; then
            cd ontology-hub-publish/medallion/dbt
            zip -r ../../../dbt-artifacts.zip .
            echo "DBT_PACKAGE=true" >> "$GITHUB_ENV"
          else
            echo "DBT_PACKAGE=false" >> "$GITHUB_ENV"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          ASSETS=""
          if [ "$DBT_PACKAGE" = "true" ]; then
            ASSETS="dbt-artifacts.zip"
          fi
          gh release create "$TAG" $ASSETS \
            --title "$TAG" \
            --generate-notes
