# Auto-generated by kairos-ontology-toolkit — do not edit.
# Tag-triggered workflow: runs projections, validates, and creates a GitHub
# Release with compiler-generated dbt artifacts for downstream consumption.

name: Release Projections

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  project-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install toolkit
        run: uv sync

      - name: Compile canonical Silver/dbt artifacts
        run: |
          cd ontology-hub
          rm -rf output/medallion/dbt
          mkdir -p output/medallion/dbt
          DOMAINS=$(uv run python -c "from pathlib import Path; import yaml; print(' '.join(sorted({str(yaml.safe_load(p.read_text())['metadata']['domain']) for p in Path('integration/bindings').glob('*.binding.yaml')})))")
          for domain in $DOMAINS; do
            uv run kairos-ontology compile "$domain" --emit
          done

      # `project --target all` contains only retained graph projections. Gold and
      # MDM are compile-plan-only consumers and are intentionally not generated here.
      - name: Run retained optional projections
        run: |
          uv run kairos-ontology project \
            --ontologies ontology-hub/model/ontologies \
            --target all

      - name: Validate ontologies
        run: |
          uv run kairos-ontology validate \
            --ontologies ontology-hub/model/ontologies \
            --shapes ontology-hub/model/shapes

      - name: Package dbt artifacts
        run: |
          rm -f dbt-artifacts.zip
          if [ -d "ontology-hub/output/medallion/dbt" ] && \
             find "ontology-hub/output/medallion/dbt" -type l -print -quit | grep -q .; then
            echo "::error::Refusing to package symlinks from compiler output."
            exit 1
          fi
          if [ -d "ontology-hub/output/medallion/dbt" ] && \
             find "ontology-hub/output/medallion/dbt" -type f -print -quit | grep -q .; then
            cd ontology-hub/output/medallion/dbt
            zip -r ../../../../dbt-artifacts.zip .
            echo "DBT_PACKAGE=true" >> "$GITHUB_ENV"
          else
            echo "DBT_PACKAGE=false" >> "$GITHUB_ENV"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          ASSETS=""
          if [ "$DBT_PACKAGE" = "true" ]; then
            ASSETS="dbt-artifacts.zip"
          fi
          gh release create "$TAG" $ASSETS \
            --title "$TAG" \
            --generate-notes
