# Auto-generated by kairos-ontology-toolkit — do not edit.
# Tag-triggered workflow: validates, and creates a GitHub Release with the
# already-tracked dbt artifacts for downstream consumption.
#
# DD-206 §4 ("release-relevant output... does not generate different bytes
# after tagging"): a release publishes exactly the bytes reviewed and merged
# in the hub PR at this tagged commit. It never regenerates
# ontology-hub-publish/medallion/dbt itself -- pr-validate.yml is what
# regenerates and diffs that output, before merge. This workflow only
# validates the tracked bytes checked out at the tag, read-only.

name: Release Projections

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  project-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # An unpinned version queries github.com's "latest release" API, which
          # 404s from a GitHub Enterprise Server host (astral-sh/uv doesn't exist
          # there). Pinning a known-good version skips that lookup entirely.
          version: "0.12.5"

      - name: Install toolkit
        run: uv sync --locked

      # DD-206 §4: the release workflow validates the tracked bytes at the tagged
      # commit; it never generates different bytes after tagging. pr-validate.yml
      # already regenerated ontology-hub-publish/medallion/dbt and failed on drift
      # before this commit could merge, so the tree checked out here is exactly
      # what a reviewer approved. This scan needs no dbt install (DD-138/139 keep
      # dbt itself, and any peer-binding search, out of per-domain compile scope)
      # and catches a dangling cross-domain externalReference (#342) that only
      # becomes visible once every domain's output is assembled together.
      #
      # The full gate, not `--structural-only` (#686): structural-only stops after the
      # ref() scan, so a project `dbt parse` refuses -- a duplicate model name, say --
      # would ship in a release. Offline and credential-free; only the final
      # `dbt compile` wants a warehouse and it degrades rather than failing. The extra
      # is resolved by the toolkit rather than composed, because DD-215 renamed the
      # adapter id to `fabric-warehouse` while the hub extra stayed `dbt-validate-fabric`.
      - name: Install dbt adapter for the full offline gate
        run: |
          set -euo pipefail
          extra="$(uv run python -c 'import re,pathlib;from kairos_ontology.core.adapters import dbt_validate_extra;t=pathlib.Path("ontology-hub/kairos.yaml").read_text(encoding="utf-8");m=re.search(r"^adapter:\s*([A-Za-z0-9._-]+)",t,re.M);print(dbt_validate_extra(m.group(1)) if m else "")')"
          if [ -z "$extra" ]; then
            echo "::error::ontology-hub/kairos.yaml declares no 'adapter:' - the dbt gate cannot run."
            exit 1
          fi
          uv sync --extra "$extra"

      - name: Validate assembled dbt package (read-only, no regeneration)
        run: |
          uv run kairos-ontology validate-dbt

      # `project --target all` contains only retained graph projections. MDM and Gold
      # are compile-plan-only consumers and are not generated by `project`; MDM is not
      # part of the release lane at all, but DD-206 §8 requires Gold's Power BI output
      # in it -- see "Package Power BI semantic model and report" below.
      - name: Run retained optional projections
        run: |
          uv run kairos-ontology project \
            --ontologies ontology-hub/model/ontologies \
            --target all

      - name: Validate ontologies
        run: |
          uv run kairos-ontology validate \
            --ontologies ontology-hub/model/ontologies \
            --shapes ontology-hub/model/shapes

      # DD-206 §8: the hub release ships the first generated Power BI report and
      # semantic model for every Gold-configured domain, validated (Fabric package
      # JSON Schema, best-effort TOM SDK TMDL structural check) and checksummed here,
      # before the archive is attached to the release. A hub with no Gold-configured
      # domain produces no archive -- `package-powerbi-release` reports that and exits
      # 0 rather than emitting a dangling artifact.
      - name: Package Power BI semantic model and report
        run: |
          cd ontology-hub
          uv run kairos-ontology package-powerbi-release \
            --confirm-emit \
            --output ../powerbi-semantic-model.zip
          if [ -f "../powerbi-semantic-model.zip" ]; then
            echo "POWERBI_PACKAGE=true" >> "$GITHUB_ENV"
          else
            echo "POWERBI_PACKAGE=false" >> "$GITHUB_ENV"
          fi

      - name: Package dbt artifacts
        run: |
          rm -f dbt-artifacts.zip
          if [ -d "ontology-hub-publish/medallion/dbt" ] && \
             find "ontology-hub-publish/medallion/dbt" -type l -print -quit | grep -q .; then
            echo "::error::Refusing to package symlinks from compiler output."
            exit 1
          fi
          if [ -d "ontology-hub-publish/medallion/dbt" ] && \
             find "ontology-hub-publish/medallion/dbt" -type f -print -quit | grep -q .; then
            cd ontology-hub-publish/medallion/dbt
            zip -r ../../../dbt-artifacts.zip .
            echo "DBT_PACKAGE=true" >> "$GITHUB_ENV"
          else
            echo "DBT_PACKAGE=false" >> "$GITHUB_ENV"
          fi

      # DD-206 §8 item 6: record the hub commit SHA and archive SHA-256 as release
      # evidence, retained with the workflow run. The dataplatform deploy workflow
      # verifies both before extracting the archive (§8 dataplatform responsibility).
      - name: Record Power BI release evidence
        if: env.POWERBI_PACKAGE == 'true'
        run: |
          {
            echo "### Power BI release evidence"
            echo "- hub commit SHA: \`${GITHUB_SHA}\`"
            echo "- powerbi-semantic-model.zip SHA-256: \`$(cut -d' ' -f1 powerbi-semantic-model.zip.sha256)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          ASSETS=""
          if [ "$DBT_PACKAGE" = "true" ]; then
            ASSETS="$ASSETS dbt-artifacts.zip"
          fi
          if [ "$POWERBI_PACKAGE" = "true" ]; then
            ASSETS="$ASSETS powerbi-semantic-model.zip powerbi-semantic-model.zip.sha256"
          fi
          gh release create "$TAG" $ASSETS \
            --title "$TAG" \
            --generate-notes
