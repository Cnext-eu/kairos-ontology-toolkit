# Auto-generated by kairos-ontology-toolkit — do not edit.
# The complete gate set, run serially: on every push to main, nightly, and on demand.
#
# pr-validate.yml is tuned for fast feedback -- two parallel jobs, and no
# `compile --all --check` because it duplicates `--emit`. This workflow is the
# unhurried counterpart. It exists for two things that a per-PR job cannot give:
#
#   1. `compile --all --check` over the whole hub, which reports every domain's verdict
#      without writing anything. `--emit` can raise on an emission-time collision
#      (a Gold table shadowing another domain's Silver model, #685) and, although the
#      emit loop reports and continues, `--check` is the mode that can never abort at
#      all -- so this is where a hub-wide collision picture is guaranteed.
#   2. A warm run on `main`. GitHub scopes a cache written on a PR branch to that PR,
#      so only a run on the base branch can populate a cache later PRs restore.
#
# Nothing here is skipped on a PR to save time: the PR workflow runs every gate this
# one does. The difference is ordering and parallelism, not coverage.

name: Full Validation

on:
  push:
    branches: [main]
  schedule:
    # 04:17 UTC -- off the hour, because scheduled workflows queue on shared capacity
    # and every-hour-on-the-hour is the worst slot to ask for it.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-validate:
    name: Full validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # An unpinned version queries github.com's "latest release" API, which
          # 404s from a GitHub Enterprise Server host (astral-sh/uv doesn't exist
          # there). Pinning a known-good version skips that lookup entirely.
          version: "0.12.5"
          enable-cache: true

      - name: Install toolkit
        run: uv sync --locked

      - name: Validate ontologies (syntax, SHACL, consistency)
        run: |
          uv run kairos-ontology validate \
            --ontologies ontology-hub/model/ontologies \
            --shapes ontology-hub/model/shapes \
            --all

      - name: Lint hand-authored dbt transforms
        env:
          KAIROS_SKILL_CONTEXT: "1"
        run: |
          uv run kairos-ontology validate-dbt-contracts --format json

      # The hub-wide, write-free verdict for every bound domain. Deliberately kept here
      # and not in the PR workflow, where it is 110s of duplicated compile work.
      - name: Compile-check every bound domain
        run: |
          uv run kairos-ontology compile --all --check --format json

      # See pr-validate.yml: the extra is resolved by the toolkit, never composed.
      - name: Install dbt adapter for the full offline gate
        run: |
          set -euo pipefail
          extra="$(uv run python -c 'import re,pathlib;from kairos_ontology.core.adapters import dbt_validate_extra;t=pathlib.Path("ontology-hub/kairos.yaml").read_text(encoding="utf-8");m=re.search(r"^adapter:\s*([A-Za-z0-9._-]+)",t,re.M);print(dbt_validate_extra(m.group(1)) if m else "")')"
          if [ -z "$extra" ]; then
            echo "::error::ontology-hub/kairos.yaml declares no 'adapter:' - the dbt gate cannot run."
            exit 1
          fi
          uv sync --locked --extra "$extra"

      # On `main` this doubles as the cache-warming run: `compile --emit` is the only
      # mode that writes the ontology-parse and reference-index caches, so a PR can only
      # ever restore a cache a main-branch run produced.
      - name: Regenerate tracked output and fail on drift
        run: |
          set -euo pipefail
          uv run kairos-ontology compile --all --emit --confirm-emit
          for path in ontology-hub-publish/medallion/dbt ontology-hub/model/contracts/diagrams; do
            if [ -d "$path" ] && [ -z "$(git ls-files "$path")" ]; then
              echo "::error::$path exists but is not tracked - the drift gate cannot verify it."
              exit 1
            fi
          done
          git diff --exit-code -- \
            ontology-hub-publish/medallion/dbt \
            ontology-hub/model/contracts/diagrams

      - name: Validate assembled dbt package
        run: |
          uv run kairos-ontology validate-dbt
