# Semantic-model (Gold / Power BI) practices owned by the catalogue (DD-240).
#
# The Microsoft Best Practice Analyzer rules belong to this area too; their dispositions
# live in core/projections/dbt/bpa_profile.py (DD-238) and are projected in by the loader.
# Fields: see src/kairos_ontology/practices/__init__.py. Regenerate the hub page with
# `uv run python scripts/generate_practices.py`.
rules:
  - id: semantic-model.ambiguous-path
    statement: >
      Between any two tables of a semantic model there is one active filter path; a
      relationship that would add a second one is deactivated, and the author decides
      whether that is the right edge to lose.
    rationale: >
      Power BI refuses to load a model with two active paths, so the projector keeps a
      spanning forest and deactivates the rest (#792). A deactivated edge filters nothing
      unless a measure calls USERELATIONSHIP: on the Fracht hub `fact_consignment ->
      dim_job` was inactive, so "consignments by job type" showed the grand total on every
      row, and nothing reported it. Declare the edge that must stay active with
      kairos-ext:goldPrimaryRelationship, remove the redundant route, or record why the
      deactivation is intended.
    enforcement: warning
    stage: compile --check
    check: gold.ambiguous-path
    source: DD-226, #792, #996
    excusable: true
    objects: [relationship]

  - id: semantic-model.fact-to-fact
    statement: >
      A fact references dimensions only; it never holds a relationship to another fact.
    rationale: >
      A fact-to-fact edge filters one fact by the rows of another, so totals change with
      the grain of the table in between, and it opens a second path to every dimension
      both facts share -- which the projector then resolves by deactivating one of them.
      Share the dimension instead, or model the header as a dimension of the line.
    enforcement: warning
    stage: compile --check
    check: gold.fact-to-fact
    source: DD-112
    excusable: true
    objects: [relationship]

  - id: semantic-model.snowflake-chain
    statement: >
      A dimension does not reference another dimension that the same fact already reaches
      directly.
    rationale: >
      Fact -> job -> branch next to fact -> branch gives the branch filter two routes into
      the fact, and one is deactivated without review. Either flatten the chain into the
      outer dimension, or drop the direct edge and filter through the chain. A chain the
      fact does not also shortcut is an ordinary snowflake, which the BPA profile does not
      reject (SNOWFLAKE_SCHEMA_ARCHITECTURE, DD-238).
    enforcement: warning
    stage: compile --check
    check: gold.snowflake-chain
    source: DD-112, DD-238
    excusable: true
    objects: [relationship]

  - id: semantic-model.role-playing-dimension
    statement: >
      A fact that references one dimension in several roles decides, per role, between
      one active relationship plus USERELATIONSHIP measures and a separate copy of the
      dimension.
    rationale: >
      Only one role can be active. The others are reported but filter nothing until a
      measure activates them, so "shipments by destination" silently uses the origin
      unless the role was designed. Dates normally stay one table with USERELATIONSHIP;
      a role a report filters on constantly usually wants its own dimension.
    enforcement: advisory
    stage: compile --check
    check: gold.role-playing-dimension
    source: DD-112, #792
    excusable: true
    objects: [relationship]

  - id: semantic-model.review-deactivated-relationships
    statement: >
      After emit-gold, review deactivated_relationships in the product report, and fix or
      excuse each one.
    rationale: >
      The product report is where every edge the projector turned off is listed with its
      reason. A model can pass every check and still answer a common question with the
      grand total; the report is the one place that says which relationships do nothing.
    enforcement: advisory
    stage: design
    check: none
    source: "#996"
    excusable: false
